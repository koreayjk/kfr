<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Food 통합 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Pretendard", "Segoe UI", sans-serif; background:#F6F2EC; color:#1E1A17; -webkit-text-size-adjust:100%; }
input, select, button { font-family: inherit; }
.login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
.login-card { background:#fff; border-radius:20px; padding:34px 30px; width:100%; max-width:390px; box-shadow:0 14px 40px rgba(110,60,30,.12); }
.login-logo-img { width:100%; max-width:260px; display:block; margin:6px auto 18px; }
.login-card h1 { text-align:center; font-size:18px; margin-bottom:4px; letter-spacing:-.3px; }
.login-card .sub { text-align:center; color:#9A8E7E; font-size:12px; margin-bottom:22px; letter-spacing:.5px; text-transform:uppercase; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
.field select, .field input { width:100%; border:1.5px solid #D8CDBD; border-radius:11px; padding:12px; font-size:15px; background:#fff; }
.err { background:#FBE4E3; color:#B5322E; padding:10px; border-radius:9px; font-size:13px; margin-bottom:14px; text-align:center; }
.setup-note { background:#FBF1DC; color:#9A6A1E; padding:14px; border-radius:11px; font-size:12.5px; line-height:1.6; margin-bottom:16px; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:13px 20px; background:#fff; border-bottom:1px solid #E6DFD4; gap:12px; }
.topbar-logo { height:30px; }
.who { display:flex; align-items:center; gap:10px; }
.who-name { font-size:13px; font-weight:600; text-align:right; }
.who-name small { display:block; color:#9A8E7E; font-weight:500; }
.logout { border:1px solid #D8CDBD; background:#fff; border-radius:9px; padding:7px 12px; font-size:12px; cursor:pointer; color:#5E4A36; }
.tabs { display:flex; gap:2px; padding:10px 20px 0; background:#fff; border-bottom:1px solid #E6DFD4; overflow-x:auto; }
.tab { border:none; background:none; padding:10px 14px; font-size:14px; font-weight:600; color:#9A8E7E; cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; }
.tab.on { color:#B5322E; border-bottom-color:#B5322E; }
.content { padding:20px; max-width:1080px; margin:0 auto; }
.grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
@media(max-width:820px){ .grid-2{ grid-template-columns:1fr; } }
.card { background:#fff; border:1px solid #E6DFD4; border-radius:16px; padding:20px; margin-bottom:18px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.card h2 { font-size:16px; font-weight:800; margin:0 0 14px; letter-spacing:-.3px; }
.card-head h2 { margin:0; }
.date-pill { background:#F3ECE0; color:#8E7A5E; font-size:12px; font-weight:600; padding:5px 10px; border-radius:20px; border:none; }
.muted { color:#9A8E7E; font-size:12px; }
.section-label { font-size:12px; font-weight:700; color:#B5322E; text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; }
.menu-row { display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F0E9DD; }
.m-name { font-weight:600; font-size:14px; }
.m-price { color:#9A8E7E; font-size:13px; }
.m-sub { font-weight:700; font-variant-numeric:tabular-nums; min-width:62px; text-align:right; color:#5E4A36; }
.stepper { display:flex; align-items:center; gap:4px; }
.stepper button { width:28px; height:28px; border:1px solid #D8CDBD; background:#fff; border-radius:7px; font-size:16px; cursor:pointer; color:#5E4A36; }
.stepper input { width:46px; text-align:center; border:1px solid #D8CDBD; border-radius:7px; padding:6px; font-size:14px; font-variant-numeric:tabular-nums; }
.exp-row { display:grid; grid-template-columns:1.2fr 100px auto; gap:8px; margin-bottom:8px; }
.exp-row select, .exp-row input { border:1px solid #D8CDBD; border-radius:8px; padding:9px 10px; font-size:13px; width:100%; }
.exp-add { border:1px solid #D8CDBD; background:#F6F2EC; border-radius:8px; width:38px; cursor:pointer; font-size:17px; color:#5E4A36; }
.sticky { align-self:start; }
.pay-input { margin-bottom:12px; }
.pay-input label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.peso-field { display:flex; align-items:center; border:1.5px solid #D8CDBD; border-radius:10px; overflow:hidden; }
.peso-field span { padding:0 12px; color:#9A8E7E; font-weight:700; background:#F6F2EC; align-self:stretch; display:flex; align-items:center; }
.peso-field input { flex:1; border:none; padding:12px; font-size:16px; font-variant-numeric:tabular-nums; outline:none; width:100%; }
.reconcile { background:#FAF6EF; border-radius:12px; padding:14px; margin:14px 0; }
.rec-row { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
.rec-row.big { font-size:16px; padding:12px 0; border-top:1px solid #E6DFD4; margin-top:8px; }
.rec-row b { font-variant-numeric:tabular-nums; }
.rec-flag { margin-top:8px; padding:10px 12px; border-radius:9px; font-weight:700; font-size:14px; text-align:center; }
.rec-flag.ok { background:#E3F3E8; color:#1F7A43; }
.rec-flag.bad { background:#FBE4E3; color:#B5322E; }
.rec-flag.idle { background:#F0E9DD; color:#9A8E7E; font-weight:500; }
.btn-primary { width:100%; background:#B5322E; color:#fff; border:none; padding:14px; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; }
.btn-primary:disabled { background:#D8CDBD; cursor:not-allowed; }
.hint { font-size:12px; color:#9A8E7E; margin:10px 0 0; line-height:1.5; }
.prev-row { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid #F0E9DD; }
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
@media(max-width:820px){ .kpi-row{ grid-template-columns:1fr; } }
.kpi { background:#fff; border:1px solid #E6DFD4; border-radius:14px; padding:18px; }
.kpi.accent { background:linear-gradient(135deg,#B5322E,#8E2420); border:none; }
.kpi-label { font-size:12px; color:#9A8E7E; margin-bottom:8px; }
.kpi.accent .kpi-label { color:#F3C9C7; }
.kpi-value { font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
.kpi.accent .kpi-value { color:#fff; }
.bar-row { display:grid; grid-template-columns:92px 1fr auto; align-items:center; gap:10px; margin-bottom:11px; }
.bar-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
.bar-track { background:#F0E9DD; border-radius:6px; height:13px; overflow:hidden; }
.bar-fill { background:linear-gradient(90deg,#C9453F,#B5322E); height:100%; }
.bar-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; text-align:right; }
.badge { font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; }
.badge.direct { background:#E8EEF6; color:#3A5A82; }
.badge.franchise { background:#F6EEE2; color:#9A6A1E; }
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th { text-align:left; color:#9A8E7E; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:8px 6px; border-bottom:2px solid #E6DFD4; }
.data-table th small { display:block; font-weight:500; text-transform:none; letter-spacing:0; color:#BDB2A0; }
.data-table td { padding:9px 6px; border-bottom:1px solid #F0E9DD; }
.data-table .num { text-align:right; font-variant-numeric:tabular-nums; }
.data-table .pos { color:#1F7A43; }
.data-table .neg { color:#B5322E; }
.empty { color:#9A8E7E; text-align:center; padding:18px; }
.tag-due { background:#FBE4E3; color:#B5322E; padding:2px 8px; border-radius:6px; font-weight:700; }
.formula { margin-top:14px; background:#FAF6EF; border-radius:10px; padding:12px 14px; font-size:13px; color:#5E4A36; line-height:1.6; }
.order-card { border:1px solid #E6DFD4; border-radius:12px; padding:14px; margin-bottom:12px; }
.order-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.order-items { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip { background:#F3ECE0; color:#5E4A36; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
.order-foot { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#5E4A36; gap:8px; flex-wrap:wrap; }
.status { font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
.s-REQUESTED { background:#F0E9DD; color:#8E7A5E; }
.s-CONFIRMED { background:#E8EEF6; color:#3A5A82; }
.s-SHIPPING { background:#FBF1DC; color:#9A6A1E; }
.s-DELIVERED { background:#E3F3E8; color:#1F7A43; }
.btn-mini { border:1px solid #B5322E; color:#B5322E; background:#fff; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; }
.done-mark { color:#1F7A43; font-weight:700; font-size:13px; }
.mode-pick { margin:14px 0; }
.mode-pick label { display:block; border:1px solid #D8CDBD; border-radius:9px; padding:11px 12px; margin-bottom:6px; font-size:13px; font-weight:600; cursor:pointer; }
.mode-pick label.on { border-color:#B5322E; background:#FBF1F0; color:#B5322E; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1E1A17; color:#fff; padding:13px 22px; border-radius:30px; font-size:14px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:99; }
.loading { text-align:center; padding:40px; color:#9A8E7E; }
.report-pl .pl-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.report-pl .pl-row.total { border-top:2px solid #E6DFD4; border-bottom:none; font-weight:800; font-size:17px; padding-top:13px; margin-top:4px; }
.report-pl b { font-variant-numeric:tabular-nums; }
.filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-bar select, .filter-bar input { border:1px solid #D8CDBD; border-radius:9px; padding:8px 10px; font-size:13px; }
.scroll-list { max-height:none; }
.kpi-row.four { grid-template-columns:repeat(4,1fr); }
@media(max-width:820px){ .kpi-row.four{ grid-template-columns:repeat(2,1fr); } }
.kpi .delta { font-size:12px; font-weight:700; margin-top:5px; }
.kpi.accent .delta { color:#F3C9C7; }
.delta.up{ color:#1F7A43; } .delta.down{ color:#B5322E; } .delta.flat{ color:#9A8E7E; }
.kpi.accent .delta.up,.kpi.accent .delta.down,.kpi.accent .delta.flat{ color:#F3C9C7; }
.report-title { font-size:18px; font-weight:800; margin:2px 0 16px; letter-spacing:-.3px; }
.report-title span { color:#9A8E7E; font-weight:600; font-size:14px; }
.ebar-row { display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:10px; margin-bottom:10px; }
.ebar-name { font-size:13px; font-weight:600; }
.ebar-track { background:#F0E9DD; border-radius:6px; height:12px; overflow:hidden; }
.ebar-fill { background:linear-gradient(90deg,#E0A93F,#C9842A); height:100%; }
.ebar-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; text-align:right; }
.pl-sub { padding-left:14px; color:#9A8E7E; font-size:13px; }
.legend { display:flex; gap:18px; margin-bottom:6px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#5E4A36; }
.legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }
.cmp-table tr.me { background:#FBF1F0; }
.cmp-table tr.me td:first-child { font-weight:800; color:#B5322E; }
.minibar { display:inline-block; height:8px; border-radius:4px; background:linear-gradient(90deg,#C9453F,#B5322E); vertical-align:middle; margin-right:6px; }
.menu-head { display:grid; grid-template-columns:1fr auto auto 60px 64px; gap:10px; font-size:11px; color:#9A8E7E; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:0 0 6px; border-bottom:2px solid #E6DFD4; margin-bottom:4px; }
.menu-head span:not(:first-child){ text-align:center; }
.menu-row.promo-row { grid-template-columns:1fr auto auto 60px 64px; }
.m-en { display:block; font-size:11px; color:#9A8E7E; font-weight:500; font-style:normal; }
.promo-box { width:60px; text-align:center; border:1px dashed #C9842A; border-radius:7px; padding:6px 4px; font-size:13px; font-variant-numeric:tabular-nums; background:#FFFDF8; }
.promo-box::placeholder { color:#D8CDBD; }
.add-form { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.add-form input, .add-form select { border:1px solid #D8CDBD; border-radius:8px; padding:9px 10px; font-size:13px; }
.add-form input { flex:1; min-width:80px; }
.mng-row { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.mng-price { font-weight:700; font-variant-numeric:tabular-nums; color:#5E4A36; }
.mng-del { border:1px solid #E0C0BE; color:#B5322E; background:#fff; border-radius:7px; padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.lang-toggle { display:flex; gap:4px; }
.lang-toggle button { border:1px solid #D8CDBD; background:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; color:#9A8E7E; cursor:pointer; white-space:nowrap; }
.lang-toggle button.on { background:#B5322E; color:#fff; border-color:#B5322E; }
.lang-sub { display:block; font-size:11px; color:#9A8E7E; font-weight:500; font-style:italic; margin-top:1px; }
.btn-primary .lang-sub { color:#F3C9C7; font-weight:600; }
.mode-pick label .lang-sub { font-weight:500; opacity:.75; }
.update-stamp { font-size:12.5px; color:#9A8E7E; font-weight:600; margin:0 0 16px; }
.update-stamp b { color:#5E4A36; }
.mng-row.editable { grid-template-columns:1fr 96px auto; }
.mng-price-input { width:96px; text-align:right; border:1px solid #D8CDBD; border-radius:7px; padding:6px 8px; font-size:13px; font-variant-numeric:tabular-nums; }
.brn-row { display:grid; grid-template-columns:1fr 84px 72px auto; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #F0E9DD; font-size:13px; }
.brn-row select, .brn-row input { border:1px solid #D8CDBD; border-radius:7px; padding:6px 8px; font-size:13px; width:100%; }
.brn-name { font-weight:600; }
.legend.multi { flex-wrap:wrap; gap:8px 16px; }
</style>
</head>

function stepQty(id,delta){const q=Math.max(0,(closingDraft.qty[id]||0)+delta);closingDraft.qty[id]=q;$("q_"+id).value=q||"";const m=menuById(id);$("sub_"+id).textContent=q>0?fmt(q*unitPrice(m)):"—";recalc();}
function setPromo(id,v){closingDraft.promo[id]=v; const m=menuById(id),q=closingDraft.qty[id]||0; $("sub_"+id).textContent=q>0?fmt(q*unitPrice(m)):"—"; recalc();}

function onDeduct(){closingDraft.deduct=$("deduct").value;recalc();}
function recalc(){
  const menuTotal=state.menus.reduce((s,m)=>s+(closingDraft.qty[m.id]||0)*unitPrice(m),0);
  const deduct=Number(closingDraft.deduct)||0;
  const target=menuTotal-deduct;
  const recv=(Number(closingDraft.cash)||0)+(Number(closingDraft.gcash)||0);
  const diff=recv-target, has=menuTotal>0||deduct>0;
  $("menuTotal").textContent=fmt(menuTotal); $("recvTotal").textContent=fmt(recv);
  const dr=$("deductRow"); if(dr){ if(deduct>0){dr.style.display="";$("deductVal").textContent="−"+fmt(deduct);} else dr.style.display="none"; }
  const f=$("flag");
  if(!has){f.className="rec-flag idle";f.textContent=tt("flag_idle");}
  else if(diff===0){f.className="rec-flag ok";f.textContent=tt("flag_ok");}
  else{f.className="rec-flag bad";f.textContent=state.lang==="ko"?`차액 ${diff>0?"+":""}${fmt(diff)} — 확인 필요`:`Diff ${diff>0?"+":""}${fmt(diff)} — please check / pakisuri`;}
  $("saveBtn").disabled = closingDraft.admin ? !(has || recv>0) : !has;
}
async function loadClosingDate(date){

  closingDraft.qty={};closingDraft.promo={};closingDraft.deduct="";closingDraft.cash="";closingDraft.gcash="";closingDraft.editId=null;
  if(rec){
    closingDraft.editId=rec.id;
    closingDraft.cash=rec.cash??"";
    closingDraft.gcash=rec.gcash??"";
    Object.entries(rec.items||{}).forEach(([id,v])=>{
      if(id==="_deduct"){ closingDraft.deduct=v; return; }
      if(String(id).startsWith("_")) return;
      if(v && typeof v==="object"){ closingDraft.qty[id]=Number(v.q||0); if(v.p) closingDraft.promo[id]=v.p; }
      else closingDraft.qty[id]=Number(v||0);

}

}

function fiscalYearBounds(dateStr){
  const [y,m]=dateStr.split("-").map(Number);
  const sy = m>=7 ? y : y-1;            // 회계연도: 7월 시작 ~ 다음해 6월 종료
  return { start:`${sy}-07-01`, end:`${sy+1}-07-01`, label:`${sy}.07 ~ ${sy+1}.06` };
}
async function screenDashboard(){
  const fy=fiscalYearBounds(today());
  const { data: closings } = await sb.from("closings").select("*").gte("date",fy.start).lt("date",fy.end);
  const cs = closings||[];
  const per = state.branches.filter(b=>b.id!==0).map(b=>{
    const my=cs.filter(c=>c.branch_id===b.id);
    const cash=my.reduce((s,c)=>s+Number(c.cash),0), gcash=my.reduce((s,c)=>s+Number(c.gcash),0);
    return {...b,cash,gcash,total:cash+gcash};
  });
  const grand=per.reduce((s,b)=>s+b.total,0), gcashTotal=per.reduce((s,b)=>s+b.gcash,0);
  const maxT=Math.max(...per.map(b=>b.total),1);

const WEEKDAY_KO=["일","월","화","수","목","금","토"];
function weekdayKo(dateStr){ return WEEKDAY_KO[new Date(dateStr+"T00:00:00").getDay()]; }
async function fetchDaily(month){
  const {start,end}=monthBounds(month);
  const {data:cs}=await sb.from("closings").select("branch_id,date,cash,gcash").gte("date",start).lt("date",end).order("date");
  const byDate={};
  (cs||[]).forEach(c=>{
    const d=String(c.date).slice(0,10);
    (byDate[d]||(byDate[d]={}));
    const cell=byDate[d][c.branch_id]||(byDate[d][c.branch_id]={c:0,g:0});
    cell.c+=Number(c.cash)||0; cell.g+=Number(c.gcash)||0;
  });
  return {dates:Object.keys(byDate).sort(), byDate};
}
const dCell=(cell)=>cell?(Number(cell.c||0)+Number(cell.g||0)):0;
async function screenDaily(){
  const month=state._dailyMonth||thisMonth();
  state._dailyMonth=month;
  const {dates,byDate}=await fetchDaily(month);
  state._dailyCache={month,dates,byDate};
  renderDaily();
}
function setDailyMonth(part,val){
  const m=state._dailyMonth||thisMonth();
  state._dailyMonth = part==="y" ? val+"-"+m.slice(5) : m.slice(0,4)+"-"+val;
  screenDaily();
}
function toggleDailyBranch(id){
  id=String(id);
  if(!state._dailySel) state._dailySel=new Set();
  if(state._dailySel.has(id)) state._dailySel.delete(id); else state._dailySel.add(id);
  renderDaily();
}

    }).join("");
    return `<div class="card"><div class="card-head"><h2>${b.name} <span class="muted" style="font-weight:600">· 현금/지케쉬</span></h2><span class="badge ${b.type.toLowerCase()}">${b.type==="DIRECT"?"직영":"가맹"}</span></div>
      <div style="overflow-x:auto"><table class="data-table">
        <thead><tr><th>날짜</th><th class="num">현금</th><th class="num">지케쉬(GCash)</th><th class="num">합계</th></tr></thead>

        <tfoot><tr style="border-top:2px solid #E6DFD4"><td><b>합계</b></td><td class="num"><b>${fmt(tc)}</b></td><td class="num"><b>${fmt(tg)}</b></td><td class="num"><b>${fmt(tc+tg)}</b></td></tr></tfoot>
      </table></div></div>`;
  }).join("")||'<p class="empty">이 달 입력이 없습니다.</p>';
  // ── 호점별 일 매출 꺾은선 (선택 호점 비교) ──
  const dim=new Date(yNow,Number(month.slice(5)),0).getDate();
  const days=Array.from({length:dim},(_,i)=>i+1);
  const labels=days.map(dn=>(dn===1||dn%5===0)?String(dn):"");
  const series=bs.map((b,i)=>({b,i})).filter(({b})=>sel.has(String(b.id))).map(({b,i})=>({
    name:b.name, color:PALETTE[i%PALETTE.length],
    values:days.map(dn=>{const d=`${month}-${String(dn).padStart(2,"0")}`; return dCell(byDate[d]&&byDate[d][b.id]);})
  }));
  const chips=bs.map((b,i)=>{const on=sel.has(String(b.id)),c=PALETTE[i%PALETTE.length];
    return `<button class="chip" onclick="toggleDailyBranch('${b.id}')" style="cursor:pointer;border:1.5px solid ${on?c:'#D8CDBD'};background:${on?c+'1A':'#fff'};color:${on?c:'#9A8E7E'}">${b.name}</button>`;}).join("");
  const chart = series.length ? svgTrend(labels, series) : `<p class="empty">비교할 호점을 선택하세요.</p>`;
  $("screen").innerHTML=`
    <div class="filter-bar">
      <select onchange="setDailyMonth('y',this.value)">${yearOpts}</select>

    </div>
    <div class="report-title">일별 매출 <span>· ${month.replace("-",". ")} · 각 호점 일 매출</span></div>
    <div class="kpi-row four">
      <div class="kpi"><div class="kpi-label">전 지점 합계</div><div class="kpi-value">${fmt(grand)}</div></div>
      <div class="kpi"><div class="kpi-label">현금 합계</div><div class="kpi-value">${fmt(cashGrand)}</div></div>
      <div class="kpi accent"><div class="kpi-label">지케쉬(GCash) 합계</div><div class="kpi-value">${fmt(gcashGrand)}</div></div>
      <div class="kpi"><div class="kpi-label">마감 일수</div><div class="kpi-value">${dayCount}일</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>매출 정정 · 추가 <span class="muted">(관리자)</span></h2></div>
      <div class="add-form">
        <select id="adBranch">${bs.map(b=>`<option value="${b.id}">${b.name}</option>`).join("")}</select>
        <input id="adDate" type="date" value="${today()}" max="${today()}">
        <button class="btn-mini" onclick="adminEditFromControls()">이 날짜 편집 / 추가</button>
      </div>
      <p class="hint">아래 표의 금액 칸을 클릭하면 그 호점·날짜의 매출을 <b>메뉴 수량까지</b> 수정할 수 있습니다. 저장된 게 없으면 새로 추가됩니다.</p>
    </div>
    <div class="card">
      <div class="card-head"><h2>날짜별 호점 매출 <span class="muted">· 총액(현금+지케쉬)</span></h2><span class="muted">빈칸(–)은 마감 입력이 없는 날</span></div>

        ${dates.length?`<tfoot><tr style="border-top:2px solid #E6DFD4"><td><b>합계</b></td>${footTot}<td class="num"><b>${fmt(grand)}</b></td></tr></tfoot>`:""}
      </table>
      </div>
    </div>
    <div class="report-title" style="margin-top:6px">호점별 현금 · 지케쉬 상세 <span>· 일자별 · 합계 포함</span></div>
    <div class="filter-bar"><select onchange="state._dailyDetailBranch=this.value;renderDaily()">${detailOpts}</select></div>
    ${detailCards}
    <div class="card">
      <div class="card-head"><h2>호점별 일 매출 추이 <span class="muted">· 1일~${dim}일</span></h2></div>
      <p class="hint" style="margin:0 0 10px">호점을 눌러 그래프에 추가/제외하세요. 여러 호점을 함께 선택해 비교할 수 있습니다.</p>
      <div class="legend multi" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">${chips}</div>
      ${chart}

}

function adminBranchKey(bId){ const o=state.branches.find(x=>String(x.id)===String(bId)); return o?o.id:bId; }
function branchNameOf(id){ const b=state.branches.find(x=>String(x.id)===String(id)); return b?b.name:id; }
function adminEditFromControls(){
  const date=$("adDate").value;
  if(!date){toast("날짜를 선택하세요");return;}
  adminEditClosing($("adBranch").value, date);
}
async function adminEditClosing(branchId, date){
  closingDraft.admin=true;
  closingDraft.branchId=adminBranchKey(branchId);
  closingDraft.date=date;
  const { data }=await sb.from("closings").select("id,items,cash,gcash").eq("branch_id",closingDraft.branchId).eq("date",date).order("id",{ascending:false}).limit(1);
  const rec=data&&data[0];
  closingDraft.qty={};closingDraft.promo={};closingDraft.deduct="";closingDraft.cash="";closingDraft.gcash="";closingDraft.editId=null;
  if(rec){
    closingDraft.editId=rec.id; closingDraft.cash=rec.cash??""; closingDraft.gcash=rec.gcash??"";
    Object.entries(rec.items||{}).forEach(([id,v])=>{
      if(id==="_deduct"){ closingDraft.deduct=v; return; }
      if(String(id).startsWith("_")) return;
      if(v && typeof v==="object"){ closingDraft.qty[id]=Number(v.q||0); if(v.p) closingDraft.promo[id]=v.p; }
      else closingDraft.qty[id]=Number(v||0);
    });
  }
  renderAdminEditor();
}

async function saveAdminClosing(){
  const items={};
  state.menus.forEach(m=>{ const q=closingDraft.qty[m.id]||0; if(q>0){ const pr=Number(closingDraft.promo[m.id]); items[m.id]= pr>0 ? {q, p:pr} : q; }});
  const deduct=Number(closingDraft.deduct)||0; if(deduct>0) items._deduct=deduct;
  $("saveBtn").disabled=true;
  const payload={ branch_id: closingDraft.branchId, date: closingDraft.date, items, cash: Number(closingDraft.cash)||0, gcash: Number(closingDraft.gcash)||0 };
  const { error } = closingDraft.editId
    ? await sb.from("closings").update(payload).eq("id",closingDraft.editId)
    : await sb.from("closings").insert(payload);
  if(error){toast("저장 실패: "+error.message);$("saveBtn").disabled=false;return;}
  toast(closingDraft.editId?"매출이 수정되었습니다":"매출이 추가되었습니다");
  screenDaily();
}
async function adminDeleteCurrent(){
  if(!closingDraft.editId){ screenDaily(); return; }
  if(!confirm(`${branchNameOf(closingDraft.branchId)} · ${closingDraft.date} 매출을 삭제할까요?`))return;
  const { error }=await sb.from("closings").delete().eq("id",closingDraft.editId);
  if(error){toast("삭제 실패: "+error.message);return;}
  toast("삭제되었습니다");
  screenDaily();
}

// ── 본사: 메뉴 판매 순위 (호점·월·일 필터) ────────
async function fetchMenuRank(month,branchId,day){
  const {start,end}=monthBounds(month);
  let q=sb.from("closings").select("branch_id,date,items").gte("date",start).lt("date",end);
  if(branchId!=="ALL") q=q.eq("branch_id",branchId);
  const {data:cs}=await q;
  let rows=cs||[];
  if(day!=="ALL"){ const ds=`${month}-${day}`; rows=rows.filter(c=>String(c.date).slice(0,10)===ds); }
  const rank={};
  rows.forEach(c=>Object.entries(c.items||{}).filter(([id])=>!String(id).startsWith("_")).forEach(([id,v])=>{
    const o=rank[id]||(rank[id]={q:0,rev:0}); o.q+=itemQty(v); o.rev+=itemRev(v,menuById(id));
  }));
  const ranked=Object.entries(rank).map(([id,o])=>({name:menuById(id)?.name||id,q:o.q,rev:o.rev})).sort((a,b)=>b.rev-a.rev||b.q-a.q);
  const dayset=new Set(rows.map(c=>String(c.date).slice(0,10)));

// ── 본사: 월별 보고서 ────────────────────────────
function monthBounds(month){
  const [y,m]=month.split("-").map(Number);
  const start=`${month}-01`;
  const ny=m===12?y+1:y, nm=m===12?1:m+1;
  const end=`${ny}-${String(nm).padStart(2,"0")}-01`;      // 다음 달 1일 (exclusive)
  const py=m===1?y-1:y, pm=m===1?12:m-1;
  const prev=`${py}-${String(pm).padStart(2,"0")}`;
  return {start,end,prev};
}
async function monthSE(branchId,month){
  const {start,end}=monthBounds(month);
  const [{data:cs},{data:ex},{data:po}]=await Promise.all([
    sb.from("closings").select("cash,gcash").eq("branch_id",branchId).gte("date",start).lt("date",end),
    sb.from("expenses").select("category,amount").eq("branch_id",branchId).gte("date",start).lt("date",end),
    sb.from("payouts").select("branch_id,unit_price,qty").gte("date",start).lt("date",end),
  ]);
  const closings=cs||[], expenses=ex||[];
  const cash=closings.reduce((s,c)=>s+Number(c.cash),0);
  const gcash=closings.reduce((s,c)=>s+Number(c.gcash),0);
  const sales=cash+gcash;
  const kit=(po||[]).filter(p=>String(p.branch_id)===String(branchId)).reduce((s,p)=>s+Number(p.unit_price||0)*Number(p.qty||0),0);
  const byCat={}; expenses.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+Number(e.amount));
  if(kit>0) byCat["밀키트"]=(byCat["밀키트"]||0)+kit;
  const expTotal=expenses.reduce((s,e)=>s+Number(e.amount),0)+kit;
  return {cash,gcash,sales,expTotal,kit,profit:sales-expTotal,byCat,days:closings.length};
}
function monthsEnding(month,count){ const [y,m]=month.split("-").map(Number); const arr=[]; for(let k=count-1;k>=0;k--){ let yy=y,mm=m-k; while(mm<=0){mm+=12;yy--;} arr.push(`${yy}-${String(mm).padStart(2,"0")}`);} return arr; }
async function fetchTrend(branchId,months){
  const start=months[0]+"-01"; const {end}=monthBounds(months[months.length-1]);
  const [{data:cs},{data:ex},{data:po}]=await Promise.all([
    sb.from("closings").select("cash,gcash,date").eq("branch_id",branchId).gte("date",start).lt("date",end),
    sb.from("expenses").select("amount,date").eq("branch_id",branchId).gte("date",start).lt("date",end),
    sb.from("payouts").select("branch_id,unit_price,qty,date").gte("date",start).lt("date",end),
  ]);
  const sales={},exp={}; months.forEach(m=>{sales[m]=0;exp[m]=0;});
  (cs||[]).forEach(c=>{const k=c.date.slice(0,7); if(k in sales)sales[k]+=Number(c.cash)+Number(c.gcash);});
  (ex||[]).forEach(e=>{const k=e.date.slice(0,7); if(k in exp)exp[k]+=Number(e.amount);});
  (po||[]).filter(p=>String(p.branch_id)===String(branchId)).forEach(p=>{const k=String(p.date).slice(0,7); if(k in exp)exp[k]+=Number(p.unit_price||0)*Number(p.qty||0);});
  return months.map(m=>({m,sales:sales[m],exp:exp[m],profit:sales[m]-exp[m]}));
}
async function fetchAllBranchMonth(month){
  const {start,end}=monthBounds(month);
  const [{data:cs},{data:ex},{data:po}]=await Promise.all([
    sb.from("closings").select("branch_id,cash,gcash").gte("date",start).lt("date",end),

    sb.from("payouts").select("branch_id,unit_price,qty").gte("date",start).lt("date",end),
  ]);
  return state.branches.filter(b=>b.id!==0).map(b=>{
    const sales=(cs||[]).filter(c=>c.branch_id===b.id).reduce((s,c)=>s+Number(c.cash)+Number(c.gcash),0);
    const kit=(po||[]).filter(p=>String(p.branch_id)===String(b.id)).reduce((s,p)=>s+Number(p.unit_price||0)*Number(p.qty||0),0);
    const expt=(ex||[]).filter(e=>e.branch_id===b.id).reduce((s,e)=>s+Number(e.amount),0)+kit;
    return {...b,sales,exp:expt,profit:sales-expt,margin:sales>0?(sales-expt)/sales*100:0};
  });

function kfmt(n){ n=Number(n)||0; const a=Math.abs(n); if(a>=1000) return PESO+(n/1000).toFixed(a%1000===0?0:1)+"k"; return PESO+Math.round(n); }
function svgTrend(labels, series){
  const W=720,H=300,pl=54,pr=18,pt=22,pb=32, iw=W-pl-pr, ih=H-pt-pb, ny=4;
  const allv=series.flatMap(s=>s.values); let max=Math.max(...allv,1); const min=Math.min(0,...allv);
  const x=i=>pl+(labels.length<=1?iw/2:iw*i/(labels.length-1));
  const y=v=>pt+ih-((v-min)/((max-min)||1))*ih;
  let grid="",ylab="";
  for(let i=0;i<=ny;i++){ const val=min+(max-min)*i/ny, yy=pt+ih-(ih*i/ny);
    grid+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="#EEE6DA"/>`;
    ylab+=`<text x="${pl-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#9A8E7E">${kfmt(val)}</text>`; }
  const xlab=labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#9A8E7E">${l}</text>`).join("");
  const paths=series.map(s=>{
    const pts=s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots=s.values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${s.color}"/>`).join("");
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${grid}${ylab}${paths}${xlab}</svg>`;
}
async function fetchAllTrend(months){
  const start=months[0]+"-01"; const {end}=monthBounds(months[months.length-1]);
  const {data:cs}=await sb.from("closings").select("branch_id,cash,gcash,date").gte("date",start).lt("date",end);
  const bs=state.branches.filter(b=>b.id!==0);
  const map={}; bs.forEach(b=>{map[b.id]={}; months.forEach(m=>map[b.id][m]=0);});
  (cs||[]).forEach(c=>{const k=c.date.slice(0,7); if(map[c.branch_id]&&k in map[c.branch_id]) map[c.branch_id][k]+=Number(c.cash)+Number(c.gcash);});
  return bs.map(b=>({id:b.id,name:b.name,values:months.map(m=>map[b.id][m])}));
}
async function screenReport(){
  const month=state._reportMonth||thisMonth();
  const branchId=state._reportBranch??state.branches.find(b=>b.id!==0)?.id;
  state._reportMonth=month; state._reportBranch=branchId;
  const {prev}=monthBounds(month);
  const months6=monthsEnding(month,6);
  const [cur,pre,trend,allb,allTrend]=await Promise.all([monthSE(branchId,month),monthSE(branchId,prev),fetchTrend(branchId,months6),fetchAllBranchMonth(month),fetchAllTrend(months6)]);
  const margin=cur.sales>0?(cur.profit/cur.sales*100):0;
  const preMargin=pre.sales>0?(pre.profit/pre.sales*100):0;
  const delta=(c,p,invert)=>{ if(!p) return {t:"전월 데이터 없음",c:"flat"}; const d=(c-p)/Math.abs(p)*100; let cls=d>0?"up":d<0?"down":"flat"; if(invert)cls=d>0?"down":d<0?"up":"flat"; return {t:`${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(0)}% (전월 대비)`,c:cls}; };
  const dS=delta(cur.sales,pre.sales,false), dE=delta(cur.expTotal,pre.expTotal,true), dP=delta(cur.profit,pre.profit,false);
  const branchOpts=state.branches.filter(b=>b.id!==0).map(b=>`<option value="${b.id}" ${b.id===branchId?"selected":""}>${b.name}</option>`).join("");
  const maxE=Math.max(...Object.values(cur.byCat),1);
  const ebars=Object.keys(cur.byCat).filter(c=>cur.byCat[c]).sort((a,b)=>cur.byCat[b]-cur.byCat[a]).map(c=>`
    <div class="ebar-row"><span class="ebar-name">${c}</span>
    <div class="ebar-track"><div class="ebar-fill" style="width:${(cur.byCat[c]/maxE)*100}%"></div></div>
    <span class="ebar-val">${fmt(cur.byCat[c])}</span></div>`).join("")||'<p class="hint">등록된 지출이 없습니다.</p>';
  const trendLabels=trend.map(t=>Number(t.m.slice(5))+"월");
  const trendSvg=svgTrend(trendLabels,[{name:"매출",color:"#B5322E",values:trend.map(t=>t.sales)},{name:"순이익",color:"#1F7A43",values:trend.map(t=>t.profit)}]);
  const allTrendSvg=svgTrend(trendLabels,allTrend.map((b,i)=>({name:b.name,color:PALETTE[i%PALETTE.length],values:b.values})));
  const allTrendLegend=allTrend.map((b,i)=>`<span><i style="background:${PALETTE[i%PALETTE.length]}"></i>${b.name}</span>`).join("");
  const sortedAll=[...allb].sort((a,b)=>b.sales-a.sales);
  const maxSalesAll=Math.max(...allb.map(b=>b.sales),1);
  const cmpRows=sortedAll.map(b=>`<tr class="${b.id===branchId?'me':''}">
    <td>${b.name} <span class="badge ${b.type.toLowerCase()}">${b.type==="DIRECT"?"직영":"가맹"}</span></td>
    <td class="num"><span class="minibar" style="width:${Math.max(4,(b.sales/maxSalesAll)*70)}px"></span>${fmt(b.sales)}</td>
    <td class="num neg">${fmt(b.exp)}</td>
    <td class="num"><b style="color:${b.profit>=0?'#1F7A43':'#B5322E'}">${fmt(b.profit)}</b></td>
    <td class="num">${b.margin.toFixed(0)}%</td></tr>`).join("");
  const totSales=allb.reduce((s,b)=>s+b.sales,0), totProfit=allb.reduce((s,b)=>s+b.profit,0);
  $("screen").innerHTML=`
    <div class="filter-bar">
      <select onchange="state._reportBranch=Number(this.value);screenReport()">${branchOpts}</select>
      <input type="month" value="${month}" onchange="state._reportMonth=this.value;screenReport()">
    </div>
    <div class="report-title">${branchOf(branchId)?.name} <span>· ${month.replace("-",". ")} 월별 보고서</span></div>
    <div class="kpi-row four">
      <div class="kpi"><div class="kpi-label">매출</div><div class="kpi-value">${fmt(cur.sales)}</div><div class="delta ${dS.c}">${dS.t}</div></div>
      <div class="kpi"><div class="kpi-label">지출</div><div class="kpi-value">${fmt(cur.expTotal)}</div><div class="delta ${dE.c}">${dE.t}</div></div>
      <div class="kpi accent"><div class="kpi-label">순이익</div><div class="kpi-value">${fmt(cur.profit)}</div><div class="delta ${dP.c}">${dP.t}</div></div>
      <div class="kpi"><div class="kpi-label">이익률</div><div class="kpi-value">${margin.toFixed(1)}%</div><div class="delta flat">전월 ${preMargin.toFixed(1)}%</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>최근 6개월 추세</h2>
        <div class="legend"><span><i style="background:#B5322E"></i>매출</span><span><i style="background:#1F7A43"></i>순이익</span></div>
      </div>
      ${trendSvg}
    </div>
    <div class="card">
      <div class="card-head"><h2>전체 호점 매출 추세 <span class="muted">· 최근 6개월</span></h2></div>
      <div class="legend multi">${allTrendLegend}</div>
      ${allTrendSvg}
    </div>
    <div class="grid-2">
      <div class="card"><h2>손익 요약</h2>
        <div class="report-pl">
          <div class="pl-row"><span>매출 합계</span><b>${fmt(cur.sales)}</b></div>
          <div class="pl-row pl-sub"><span>· 현금</span><b>${fmt(cur.cash)}</b></div>
          <div class="pl-row pl-sub"><span>· GCash</span><b>${fmt(cur.gcash)}</b></div>
          <div class="pl-row pl-sub"><span>· 밀키트 대금(지급 장부)</span><b>${fmt(cur.kit||0)}</b></div>
          <div class="pl-row"><span>− 지출 합계</span><b style="color:#B5322E">${fmt(cur.expTotal)}</b></div>
          <div class="pl-row total"><span>순이익</span><b style="color:${cur.profit>=0?'#1F7A43':'#B5322E'}">${fmt(cur.profit)}</b></div>
        </div>
        <p class="hint">마감 ${cur.days}일 집계 · 지출에 <b>밀키트 대금(지급 장부)</b> 포함</p>
      </div>
      <div class="card"><h2>지출 항목별 내역</h2>${ebars}</div>
    </div>
    <div class="card">
      <div class="card-head"><h2>전 지점 비교 · ${month.replace("-",". ")}</h2><span class="muted">매출순 정렬 · 현재 선택 지점 강조</span></div>
      <table class="data-table cmp-table"><thead><tr><th>지점</th><th>매출</th><th>지출</th><th>순이익</th><th>이익률</th></tr></thead>
      <tbody>${cmpRows}</tbody>
      <tfoot><tr style="border-top:2px solid #E6DFD4"><td><b>전체 합계</b></td><td class="num"><b>${fmt(totSales)}</b></td><td class="num neg">${fmt(allb.reduce((s,b)=>s+b.exp,0))}</td><td class="num"><b style="color:${totProfit>=0?'#1F7A43':'#B5322E'}">${fmt(totProfit)}</b></td><td class="num">${totSales>0?(totProfit/totSales*100).toFixed(0):0}%</td></tr></tfoot>
      </table>
    </div>`;
}

// ── 본사: 관리 (메뉴 + 지출) ─────────────────────
const manageState = { newCat:"GENERAL", expBranch:null, expMonth:null };
async function screenManage(){
  const ms=state.menus;
  const grp=(cat)=>ms.filter(m=>(m.category||"GENERAL")===cat);
  const menuList=(cat)=>grp(cat).map(m=>`<div class="mng-row editable">
    <span>${m.name}${m.name_en?` <em class="m-en">${m.name_en}</em>`:""}</span>
    <input class="mng-price-input" type="number" inputmode="numeric" value="${m.price}" onchange="updateMenuPrice('${m.id}',this.value)">
    <button class="mng-del" onclick="delMenu('${m.id}','${m.name.replace(/'/g,"")}')">삭제</button></div>`).join("")||'<p class="hint">없음</p>';

  const bId = manageState.expBranch ?? state.branches.find(b=>b.id!==0)?.id;
  const month = manageState.expMonth ?? thisMonth();
  manageState.expBranch=bId; manageState.expMonth=month;
  const {start,end}=monthBounds(month);
  const { data: exlist } = await sb.from("expenses").select("*").eq("branch_id",bId).gte("date",start).lt("date",end).order("date",{ascending:false});
  const branchOpts=state.branches.filter(b=>b.id!==0).map(b=>`<option value="${b.id}" ${b.id===bId?"selected":""}>${b.name}</option>`).join("");
  const catOpts=EXPENSE_CATS.map(c=>`<option value="${c}">${c}</option>`).join("");
  const expRows=(exlist=>exlist&&exlist.length?exlist.map(e=>`<div class="mng-row">
    <span>${e.date.slice(5)} · ${e.category}</span><span class="mng-price">${fmt(e.amount)}</span>
    <button class="mng-del" onclick="delExpense(${e.id})">삭제</button></div>`).join(""):'<p class="hint">이 달 등록된 지출이 없습니다.</p>')(exlist);
  const expTotal=(exlist||[]).reduce((s,e)=>s+Number(e.amount),0);
  const branchRows=state.branches.filter(b=>b.id!==0).sort((a,b)=>a.id-b.id).map(b=>`<div class="brn-row">
    <span class="brn-name">${b.id}. ${b.name}</span>
    <select onchange="updateBranchType(${b.id},this.value)"><option value="DIRECT" ${b.type==="DIRECT"?"selected":""}>직영</option><option value="FRANCHISE" ${b.type==="FRANCHISE"?"selected":""}>가맹</option></select>
    <input value="${b.pin??""}" onchange="updateBranchPin(${b.id},this.value)" title="PIN">
    <button class="mng-del" onclick="delBranch(${b.id},'${(b.name||"").replace(/'/g,"")}')">삭제</button></div>`).join("")||'<p class="hint">등록된 지점이 없습니다.</p>';

  $("screen").innerHTML=`
    ${state.menuUpdatedAt?`<div class="update-stamp">메뉴 가격 최종 수정: <b>${state.menuUpdatedAt}</b></div>`:""}
    <div class="grid-2">
    <div class="card">
      <h2>메뉴 관리</h2>
      <div class="add-form">
        <input id="nmName" placeholder="메뉴명 (한글)">
        <input id="nmEn" placeholder="영문명">
        <input id="nmPrice" type="number" inputmode="numeric" placeholder="가격">
        <select id="nmCat">
          <option value="GENERAL">일반</option>
          <option value="SINGLE">단품</option>
        </select>
        <button class="btn-mini" onclick="addMenu()">추가</button>
      </div>
      <div class="section-label">일반 메뉴</div>${menuList("GENERAL")}
      <div class="section-label">단품 메뉴</div>${menuList("SINGLE")}
    </div>
    <div class="card">
      <h2>지출 입력 · 관리 <span class="muted">(본사 전용)</span></h2>
      <div class="filter-bar">
        <select onchange="manageState.expBranch=Number(this.value);screenManage()">${branchOpts}</select>
        <input type="month" value="${month}" onchange="manageState.expMonth=this.value;screenManage()">
      </div>
      <div class="add-form">
        <input id="exDate" type="date" value="${today()}">
        <select id="exCat">${catOpts}</select>
        <input id="exAmt" type="number" inputmode="numeric" placeholder="금액">
        <button class="btn-mini" onclick="addExpense(${bId})">추가</button>
      </div>
      <div class="rec-row big"><span>${month.replace("-",". ")} 지출 합계</span><b>${fmt(expTotal)}</b></div>
      ${expRows}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h2>지점 관리</h2><span class="muted">3호점 삭제 · 직영/가맹 설정은 여기서</span></div>
    <div class="add-form">
      <input id="brnId" type="number" inputmode="numeric" placeholder="호점 번호 (예: 8)" style="max-width:150px">
      <input id="brnName" placeholder="지점 이름 (예: 8호점)">
      <select id="brnType"><option value="DIRECT">직영</option><option value="FRANCHISE">가맹</option></select>
      <input id="brnPin" placeholder="PIN" style="max-width:100px">
      <button class="btn-mini" onclick="addBranch()">추가</button>
    </div>
    ${branchRows}
  </div>
  <div class="card">
    <div class="card-head"><h2>관리자 비밀번호 변경 <span class="muted">(로그인 '본사 관리자' PIN)</span></h2></div>
    <div class="add-form">
      <input id="admPin" type="password" inputmode="numeric" placeholder="새 비밀번호(PIN)" style="max-width:200px">
      <button class="btn-mini" onclick="updateAdminPin()">변경</button>
    </div>
    <p class="hint">본사 관리자 계정으로 로그인할 때 사용하는 PIN을 바꿉니다.</p>
  </div>`;
}
async function updateAdminPin(){
  const pin=String($("admPin").value||"").trim();
  if(!pin){toast("새 비밀번호를 입력하세요");return;}
  const { error }=await sb.from("branches").update({pin}).eq("id",0);
  if(error){toast("변경 실패: "+error.message);return;}
  const a=state.branches.find(b=>Number(b.id)===0); if(a)a.pin=pin;
  $("admPin").value="";
  toast("관리자 비밀번호가 변경되었습니다");
}
async function addMenu(){
  const name=$("nmName").value.trim(), en=$("nmEn").value.trim(), price=Number($("nmPrice").value), cat=$("nmCat").value;
  if(!name||!price){toast("메뉴명과 가격을 입력하세요");return;}
  const id="u"+Date.now();
  const sort=(cat==="SINGLE"?200:50)+ (state.menusAll.filter(m=>m.category===cat).length);
  const { error } = await sb.from("menus").insert({id,name,name_en:en||null,price,category:cat,sort,active:true});
  if(error){toast("추가 실패: "+error.message);return;}
  state.menusAll.push({id,name,name_en:en,price,category:cat,sort,active:true});
  state.menus=state.menusAll.filter(x=>x.active!==false);
  await touchMenuUpdate();
  toast("메뉴가 추가되었습니다"); screenManage();
}
async function delMenu(id,name){
  if(!confirm(`'${name}' 메뉴를 삭제할까요?\n(과거 매출 기록은 보존되고 마감 화면에서만 사라집니다)`))return;
  const { error } = await sb.from("menus").update({active:false}).eq("id",id);
  if(error){toast("삭제 실패: "+error.message);return;}
  const m=menuById(id); if(m)m.active=false;
  state.menus=state.menusAll.filter(x=>x.active!==false);
  await touchMenuUpdate();
  toast("메뉴가 삭제되었습니다"); screenManage();
}
async function updateMenuPrice(id,v){
  const price=Number(v);
  if(!(price>0)){toast("올바른 가격을 입력하세요");screenManage();return;}
  const m=menuById(id); if(m && m.price===price) return;
  const { error } = await sb.from("menus").update({price}).eq("id",id);
  if(error){toast("수정 실패: "+error.message);return;}
  if(m)m.price=price;
  await touchMenuUpdate();
  toast(`'${m?m.name:""}' 가격이 ${fmt(price)}(으)로 수정되었습니다`); screenManage();
}
async function addBranch(){
  const id=Number($("brnId").value), name=$("brnName").value.trim(), type=$("brnType").value, pin=$("brnPin").value.trim();
  if(!id||!name||!pin){toast("호점 번호·이름·PIN을 모두 입력하세요");return;}
  if(id===0){toast("0번은 본사 전용입니다");return;}
  if(state.branches.some(b=>b.id===id)){toast("이미 존재하는 호점 번호입니다");return;}
  const { error } = await sb.from("branches").insert({id,name,type,pin});
  if(error){toast("추가 실패: "+error.message);return;}
  state.branches.push({id,name,type,pin});
  toast(`${name}이(가) 추가되었습니다`); screenManage();
}
async function delBranch(id,name){
  if(!confirm(`'${name}'을(를) 삭제할까요?\n(이 지점은 더 이상 로그인할 수 없습니다. 과거 마감/지출 기록은 DB에 남습니다)`))return;
  const { error } = await sb.from("branches").delete().eq("id",id);
  if(error){toast("삭제 실패: "+error.message);return;}
  state.branches=state.branches.filter(b=>b.id!==id);
  toast(`${name}이(가) 삭제되었습니다`); screenManage();
}
async function updateBranchType(id,type){
  const { error } = await sb.from("branches").update({type}).eq("id",id);
  if(error){toast("변경 실패: "+error.message);screenManage();return;}
  const b=branchOf(id); if(b)b.type=type;
  toast(`유형이 ${type==="DIRECT"?"직영":"가맹"}(으)로 변경되었습니다`);
}
async function updateBranchPin(id,pin){
  pin=String(pin).trim();
  if(!pin){toast("PIN은 비울 수 없습니다");screenManage();return;}
  const { error } = await sb.from("branches").update({pin}).eq("id",id);
  if(error){toast("변경 실패: "+error.message);return;}
  const b=branchOf(id); if(b)b.pin=pin;
  toast("PIN이 변경되었습니다");
}
async function addExpense(bId){
  const date=$("exDate").value, category=$("exCat").value, amount=Number($("exAmt").value);
  if(!date||!amount){toast("날짜와 금액을 입력하세요");return;}
  const { error } = await sb.from("expenses").insert({branch_id:bId,date,category,amount});
  if(error){toast("저장 실패: "+error.message);return;}
  toast("지출이 등록되었습니다"); screenManage();
}
async function delExpense(id){
  const { error } = await sb.from("expenses").delete().eq("id",id);
  if(error){toast("삭제 실패: "+error.message);return;}
  screenManage();
}

init();
</script>
